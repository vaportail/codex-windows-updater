[package]
name = "codex-native-updater"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.17", default-features = false, features = ["napi4", "dyn-symbols"] }
napi-derive = "2.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
