[package]
name = "codex-identity-shim"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
crate-type = ["cdylib"]

[dependencies]
codex-package-identity = { path = "../identity" }
retour = { version = "0.3", default-features = false }
windows = { version = "0.58", features = ["ApplicationModel", "Foundation_Collections", "Storage", "System"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Com"] }
