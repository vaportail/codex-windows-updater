[package]
name = "codex-identity-probe-addon"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
windows = { version = "0.58", features = ["ApplicationModel", "Foundation", "System", "Win32_System_WinRT"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_Threading"] }
